[profile.default]
out = "out"
src = "src"
test = "test"
script = "script"
libs = ["node_modules", "lib"]
# Resolve @gluwa/asc-contracts from yarn/npm (readability ASCBase + common/EvmV1Decoder).
# Package: https://www.npmjs.com/package/@gluwa/asc-contracts
allow_paths = ["node_modules", "lib"]
remappings = [
    "@openzeppelin/=node_modules/@openzeppelin/",
    "@gluwa/asc-contracts/=node_modules/@gluwa/asc-contracts/",
    "forge-std/=lib/forge-std/src/",
]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "shanghai"
verbosity = 2